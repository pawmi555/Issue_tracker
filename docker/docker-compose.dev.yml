services:
  # =====================================
  # Backend API (Express)
  # =====================================
  app:
    build:
      context: ../app
      dockerfile: Dockerfile

    container_name: IssueTracker_app

    working_dir: /app

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ../app/.env

    ports:
      - "3000:3000"
      # Prisma Studio
      - "5555:5555"

    volumes:
      # ソースコード同期（ホットリロード）
      - ../app:/app

      # node_modules はコンテナ側を利用
      - /app/node_modules

    command: /docker-entrypoint.sh

    stdin_open: true
    tty: true

  # =====================================
  # Frontend (React + Vite)
  # =====================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: IssueTracker_frontend

    working_dir: /frontend

    environment:
      NODE_ENV: development

      # Docker Desktop(Windows/macOS)で
      # Viteのホットリロードを安定させる
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "5173:5173"

    volumes:
      # ソースコード同期（ホットリロード）
      - ../frontend:/frontend

      # node_modules はコンテナ側を利用
      - /frontend/node_modules

    command: npm run dev -- --host 0.0.0.0

    stdin_open: true
    tty: true

  # =====================================
  # Database (PostgreSQL)
  # =====================================
  db:
    image: postgres:15

    container_name: IssueTracker_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: issue_dev_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d issue_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
