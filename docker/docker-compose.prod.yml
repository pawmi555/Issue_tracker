services:
  # =====================================
  # Backend API (Express)
  # =====================================
  app:
    build:
      context: ../app
      dockerfile: Dockerfile.prod

    image: issue-tracker-api:latest

    container_name: IssueTracker_app_prod

    working_dir: /app

    env_file:
      - ../app/.env.production

    environment:
      NODE_ENV: production

    depends_on:
      db:
        condition: service_healthy

    # Dockerネットワーク内のみ公開
    expose:
      - "3000"

    command: /docker-entrypoint.sh

    restart: unless-stopped

  # =====================================
  # Frontend (React + Nginx)
  # =====================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod

    image: issue-tracker-frontend:latest

    container_name: IssueTracker_frontend_prod

    depends_on:
      app:
        condition: service_started

    ports:
      - "80:80"

    restart: unless-stopped

  # =====================================
  # Database (PostgreSQL)
  # =====================================
  db:
    image: postgres:15

    container_name: IssueTracker_db_prod

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    # Dockerネットワーク内のみ公開
    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
